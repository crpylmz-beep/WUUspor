name: WUUspor Transfermarkt Sakat/Cezalı

on:
  schedule:
    - cron: '0 6 * * *'   # 09:00 TSI (UTC+3)
    - cron: '0 12 * * *'  # 15:00 TSI (UTC+3)
    - cron: '0 18 * * *'  # 21:00 TSI (UTC+3)
  workflow_dispatch:

concurrency:
  group: wuuspor-eksikler
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Transfermarkt sakat/cezalı verisini çek
        run: python scripts/kaynaklar/transfermarkt.py
        env:
          TZ: Europe/Istanbul

      - name: Değişiklikleri commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Transfermarkt eksikler güncelleme: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase || true
          git push || true