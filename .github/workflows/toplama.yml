name: WUUspor Veri Toplama

on:
  schedule:
    - cron: '*/10 * * * *'  # Her 10 dakikada bir
  workflow_dispatch:

concurrency:
  group: wuuspor-toplama
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 lxml

      - name: ESPN verisini çek
        run: python scripts/kaynaklar/espn.py
        env:
          TZ: Europe/Istanbul

      - name: Maçkolik verisini çek
        run: python scripts/kaynaklar/mackolik.py
        env:
          TZ: Europe/Istanbul

      - name: WorldCup26 verisini çek
        run: python scripts/kaynaklar/worldcup26.py
        env:
          TZ: Europe/Istanbul

      - name: RSS haberlerini çek
        run: python scripts/kaynaklar/rss.py
        env:
          TZ: Europe/Istanbul

      - name: Değişiklikleri commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Veri güncelleme: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase || true
          git push || true