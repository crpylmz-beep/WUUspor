name: WUUspor Maç Takip ve Bildirim

on:
  schedule:
    - cron: '*/5 * * * *'  # Her 5 dakikada bir
  workflow_dispatch:
    inputs:
      favori_takim:
        description: 'Favori takım kodu (gs, fb, bjk, ts)'
        required: true
        default: 'gs'

concurrency:
  group: wuuspor-mac-takip
  cancel-in-progress: false

jobs:
  takip:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pywebpush

      - name: ESPN verisini çek
        run: python scripts/kaynaklar/espn.py
        env:
          TZ: Europe/Istanbul

      - name: Bildirim gönder
        run: python scripts/push_gonder.py
        env:
          TZ: Europe/Istanbul
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          FAVORITE_TEAM: ${{ github.event.inputs.favori_takim || 'gs' }}